name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ -v
      - name: Research pipeline
        run: python scripts/research_pipeline.py validate
      - name: Curriculum
        run: python scripts/curriculum_cli.py validate
