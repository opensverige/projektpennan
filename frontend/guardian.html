<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skooli Buddy – Föräldravy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f6f8fb;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1c4587;
            color: white;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 999px;
            padding: 6px 14px;
        }

        .content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 32px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .report-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .report-item {
            padding: 16px;
            border: 1px solid #e0e6f0;
            border-radius: 12px;
            cursor: pointer;
            transition: border 0.15s ease, box-shadow 0.15s ease;
            background: #fff;
        }

        .report-item:hover {
            border-color: #4a90d9;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .report-item.active {
            border-color: #1c4587;
            background: #f3f7ff;
        }

        .report-detail h2 {
            margin-top: 0;
        }

        ul {
            padding-left: 20px;
        }

        .empty-state {
            text-align: center;
            color: #777;
            padding: 40px;
        }
    </style>
</head>
<body>
<header>
    <div>
        <strong>Föräldravy</strong>
        <div>Rapporter från Skooli Buddy</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="start.html">Sätt upp plattan</a>
        <a href="index.html">↩ Tillbaka till chatten</a>
    </div>
</header>

<div class="content">
    <div class="card">
        <h3>Rapporter</h3>
        <div id="reportList" class="report-list"></div>
    </div>
    <div class="card report-detail" id="reportDetail">
        <div class="empty-state">Välj en rapport för att se detaljer.</div>
    </div>
</div>

<script>
async function loadReports() {
    const listEl = document.getElementById("reportList");
    const detailEl = document.getElementById("reportDetail");
    listEl.innerHTML = "Laddar...";

    try {
        const res = await fetch("/api/reports");
        const data = await res.json();
        const reports = data.reports || [];

        if (!reports.length) {
            listEl.innerHTML = '<div class="empty-state">Inga rapporter sparade ännu.</div>';
            detailEl.innerHTML = '<div class="empty-state">När rapporter skapas visas de här.</div>';
            return;
        }

        listEl.innerHTML = "";
        reports.forEach((report) => {
            const div = document.createElement("div");
            div.className = "report-item";
            div.innerHTML = `<strong>${report.title}</strong><br><small>${report.period || ""}</small><p>${report.summary || ""}</p>`;
            div.addEventListener("click", () => showReport(report.id, div));
            listEl.appendChild(div);
        });
    } catch (err) {
        console.error(err);
        listEl.innerHTML = '<div class="empty-state">Kunde inte läsa rapporter.</div>';
    }
}

async function showReport(reportId, element) {
    const detailEl = document.getElementById("reportDetail");
    document.querySelectorAll('.report-item').forEach((item) => item.classList.remove('active'));
    element.classList.add('active');
    detailEl.innerHTML = "Laddar...";

    try {
        const res = await fetch(`/api/reports/${reportId}`);
        if (!res.ok) throw new Error("Not found");
        const report = await res.json();

        detailEl.innerHTML = `
            <h2>${report.title}</h2>
            <p><strong>Period:</strong> ${report.period || ""}</p>
            <p>${report.summary || ""}</p>
            ${renderList('Höjdpunkter', report.highlights)}
            ${renderList('Att göra', report.todo)}
            ${report.notes ? `<p><strong>Noteringar:</strong> ${report.notes}</p>` : ''}
        `;
    } catch (err) {
        detailEl.innerHTML = '<div class="empty-state">Kunde inte läsa rapporten.</div>';
    }
}

function renderList(title, items) {
    if (!items || !items.length) return '';
    return `
        <h4>${title}</h4>
        <ul>${items.map((item) => `<li>${item}</li>`).join('')}</ul>
    `;
}

loadReports();
</script>
</body>
</html>
