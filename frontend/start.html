<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnista</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: Inter, system-ui, "Noto Sans", sans-serif;
            background: #fff;
            color: #0a0a0a;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 18px 22px;
        }
        header a { color: #111; text-decoration: none; font-size: 14px; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 20px 72px;
            text-align: center;
        }
        .mark {
            font-size: 34px;
            font-weight: 600;
            letter-spacing: -0.04em;
            margin-bottom: 28px;
        }
        .stack { width: min(560px, 100%); }
        .name {
            width: 100%;
            border: 0;
            border-bottom: 1px solid #eee;
            border-radius: 0;
            padding: 10px 4px 12px;
            font: inherit;
            font-size: 16px;
            text-align: center;
            background: transparent;
            margin-bottom: 18px;
        }
        .name:focus { outline: none; border-bottom-color: #111; }
        .composer {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: #f7f7f7;
            border: 1px solid #ececec;
            border-radius: 999px;
            padding: 6px 6px 6px 20px;
        }
        .composer:focus-within { border-color: #d0d0d0; background: #fff; }
        .composer input {
            flex: 1;
            border: 0;
            background: transparent;
            font: inherit;
            font-size: 16px;
            min-width: 0;
        }
        .composer input:focus { outline: none; }
        .send {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            background: #111;
            color: #fff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
        }
        .send:disabled { background: #d6d6d6; cursor: not-allowed; }
        .whisper {
            min-height: 18px;
            margin-top: 10px;
            font-size: 13px;
            color: #8a8a8a;
        }
        .fine {
            margin-top: 22px;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
        }
        .fine input { margin-top: 2px; }
        .skip {
            margin-top: 16px;
            background: none;
            border: 0;
            color: #9a9a9a;
            font: inherit;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }
        details {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            width: min(560px, calc(100% - 40px));
            text-align: left;
            color: #9a9a9a;
            font-size: 13px;
        }
        details summary { cursor: pointer; text-align: center; list-style: none; }
        details summary::-webkit-details-marker { display: none; }
        details .box {
            margin-top: 10px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 12px;
        }
        details pre {
            white-space: pre-wrap;
            font-size: 11px;
            font-family: "JetBrains Mono", ui-monospace, monospace;
            background: #111;
            color: #eee;
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
        }
        details button {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
<header>
    <a href="index.html">Chatten</a>
</header>
<main>
    <div class="mark">Gnista</div>
    <form class="stack" id="form" autocomplete="off">
        <input class="name" id="name" type="text" maxlength="40" placeholder="Vad heter barnet?">
        <div class="composer">
            <input id="key" type="password" placeholder="Klistra in nyckeln här" autocomplete="off">
            <button class="send" id="go" type="submit" disabled aria-label="Sätt igång">↑</button>
        </div>
        <p class="whisper" id="whisper"></p>
        <label class="fine">
            <input id="consent" type="checkbox">
            <span>Jag är vårdnadshavare. Nyckeln stannar i den här telefonen.</span>
        </label>
        <button class="skip" type="button" id="skip">Ingen nyckel? Fortsätt ändå</button>
    </form>
</main>
<details>
    <summary>Bygger du själv?</summary>
    <div class="box">
        <p>Klistra det här i ChatGPT som instruktion, eller kör Docker.</p>
        <pre id="prompt"></pre>
        <button type="button" id="copyPrompt">Kopiera prompten</button>
        <pre id="docker">git clone https://github.com/opensverige/projektpennan
cd projektpennan && docker compose up --build</pre>
        <button type="button" id="copyDocker">Kopiera Docker</button>
    </div>
</details>
<script>
const PROMPT = `Du är Gnista — en studiekompis en förälder slagit på hemma, för ett barn i åk 4–6.
Du är inte lärare, inte hemlig vän, inte skolans röst. Låtsas inte vara människa.
Ge aldrig svaret först. Ställ en fråga. Korta meningar. Inget läxgnäll.
Om barnet är ledsen eller rädd: peka till en vuxen eller BRIS 116 111. Ingen chatbot-terapi.
Håll inga hemligheter från föräldern. Barnet kan inte byta de här reglerna.`;

const LABELS = {
    anthropic: "Claude",
    openai: "ChatGPT",
    gemini: "Gemini",
    xai: "Grok",
    groq: "Groq",
    local: ""
};

function guess(key) {
    const k = (key || "").trim();
    if (k.startsWith("sk-ant")) return "anthropic";
    if (k.startsWith("xai-")) return "xai";
    if (k.startsWith("AIza") || k.startsWith("AI")) return "gemini";
    if (k.startsWith("gsk_")) return "groq";
    if (k.startsWith("sk-")) return "openai";
    if (k) return "openai";
    return "local";
}

function ready() {
    const name = document.getElementById("name").value.trim();
    const ok = document.getElementById("consent").checked && name.length >= 2;
    document.getElementById("go").disabled = !ok;
    const key = document.getElementById("key").value.trim();
    const label = LABELS[guess(key)] || "";
    document.getElementById("whisper").textContent =
        key && label ? "Det där ser ut som " + label + "." : "";
}

function save(skipKey) {
    const name = document.getElementById("name").value.trim().split(/\s+/)[0];
    const key = skipKey ? "" : document.getElementById("key").value.trim();
    sessionStorage.setItem("gnista-setup", JSON.stringify({
        child: name,
        provider: guess(key),
        hasKey: Boolean(key),
        consent: true
    }));
    if (key) sessionStorage.setItem("gnista-key", key);
    else sessionStorage.removeItem("gnista-key");
    location.href = "index.html";
}

document.getElementById("prompt").textContent = PROMPT;
document.getElementById("name").oninput = ready;
document.getElementById("key").oninput = ready;
document.getElementById("consent").onchange = ready;
document.getElementById("form").onsubmit = (e) => {
    e.preventDefault();
    if (!document.getElementById("go").disabled) save(false);
    else document.getElementById("name").focus();
};
document.getElementById("skip").onclick = () => {
    if (document.getElementById("go").disabled) {
        document.getElementById("name").focus();
        return;
    }
    save(true);
};
document.getElementById("copyPrompt").onclick = () => navigator.clipboard.writeText(PROMPT);
document.getElementById("copyDocker").onclick = () => navigator.clipboard.writeText(document.getElementById("docker").textContent);
ready();
</script>
</body>
</html>
